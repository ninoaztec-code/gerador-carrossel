services:
  gerador-carrossel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gerador-carrossel
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      CAROUSEL_API_KEY: ${CAROUSEL_API_KEY:-}
      CAROUSEL_PUBLIC_ORIGIN: ${CAROUSEL_PUBLIC_ORIGIN:-https://carrossel.magodastesouras.com.br}
      CAROUSEL_PROJECTS_DIR: /data/carousel/projects
      CAROUSEL_API_BASE: ${CAROUSEL_API_BASE:-}
      CAROUSEL_IMAGE_API_BASE: ${CAROUSEL_IMAGE_API_BASE:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "127.0.0.1:3007:3000"
    volumes:
      - carousel-projects:/data/carousel/projects
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/hermes/projects').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  coolify:
    external: true

volumes:
  carousel-projects:
